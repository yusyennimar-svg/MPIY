<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Lab Maya Matematika – Kesebangunan dan Kekongruenan | SMPN 42 Pekanbaru</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06142b;--ink2:#0b2147;--glass:rgba(7,22,48,.76);--line:rgba(94,214,255,.28);
  --glow:#3ee0ff;--glow2:#7b8cff;--amber:#ffc43d;--ok:#2fe6a0;--bad:#ff5f7a;--paper:#eaf6ff;--mute:#9fb6d4;
  --fh:'Sora','Lexend',system-ui,sans-serif;--fb:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#06142b}}
:root[data-theme="dark"]{--ink:#06142b}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{position:fixed;inset:0;margin:0;overflow:hidden;background:#050d1c;color:var(--paper);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
[hidden]{display:none!important}
#bgfx{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(26px) brightness(.45) saturate(1.2);transform:scale(1.12)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;border-radius:6px;background:#06142b;box-shadow:0 0 0 1px rgba(94,214,255,.25),0 30px 80px rgba(0,0,0,.6)}

/* ---------- cover ---------- */
#cover{position:absolute;inset:0;background-size:cover;background-position:center;z-index:50;transition:opacity .7s ease,transform .7s ease}
#cover.out{opacity:0;transform:scale(1.04);pointer-events:none}
#cover::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(3,10,24,.92) 0,rgba(3,10,24,.55) 22%,rgba(3,10,24,0) 46%),radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(3,10,24,.38) 100%)}
#cvPanel{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);width:460px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:92px;justify-content:flex-end}
#ldWrap{width:100%;padding:14px 18px 16px;border-radius:16px;background:rgba(5,17,38,.72);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(62,224,255,.18)}
.ldTop{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--paper);margin-bottom:10px}
.ldTop b{margin-left:auto;font-family:var(--fh);font-size:15px;color:var(--glow)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(62,224,255,.25);border-top-color:var(--glow);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--glow2),var(--glow));box-shadow:0 0 14px var(--glow);transition:width .25s linear}
.start{position:relative;font:700 21px var(--fh);letter-spacing:.5px;color:#04223d;border:0;cursor:pointer;padding:15px 64px;border-radius:999px;background:linear-gradient(135deg,#7df0ff,var(--glow) 55%,#74a6ff);box-shadow:0 0 0 2px rgba(255,255,255,.55) inset,0 0 36px rgba(62,224,255,.7),0 10px 30px rgba(0,0,0,.4);transition:transform .15s}
.start:hover{transform:scale(1.05)}
.start::after{content:"";position:absolute;inset:-7px;border-radius:999px;border:2px solid var(--glow);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.96)}to{opacity:0;transform:scale(1.14)}}
#cvTitle{position:absolute;left:0;right:0;bottom:22px;text-align:center;font:500 14px var(--fb);letter-spacing:.3px;color:#cfe6ff;text-shadow:0 1px 8px rgba(0,0,0,.8)}

/* ---------- app shell ---------- */
#app{position:absolute;inset:0;background:linear-gradient(160deg,rgba(6,20,43,.9),rgba(5,14,32,.94))}
#app::before{content:"";position:absolute;inset:0;background-image:var(--bgimg);background-size:cover;background-position:center;opacity:.22;filter:blur(3px)}
#topbar{position:absolute;left:0;right:0;top:0;height:3px;z-index:20;overflow:hidden}
#topbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow2),var(--glow),var(--amber));box-shadow:0 0 10px var(--glow)}
#topbar.go i{animation:tb .6s ease-out}
@keyframes tb{0%{width:0;opacity:1}85%{width:100%;opacity:1}100%{width:100%;opacity:0}}
header{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:18px;padding:0 22px;z-index:10}
.brand{display:flex;align-items:center;gap:10px;width:290px}
.brand b{display:block;font:700 16px var(--fh);letter-spacing:.2px}
.brand small{display:block;font-size:12px;color:var(--mute)}
#tabs{display:flex;gap:6px;margin:0 auto;padding:5px;border-radius:16px;background:rgba(4,14,32,.7);border:1px solid var(--line)}
#tabs button{font:600 15px var(--fb);color:var(--mute);background:transparent;border:0;border-radius:11px;padding:9px 22px;cursor:pointer;transition:.18s}
#tabs button:hover{color:var(--paper);background:rgba(255,255,255,.06)}
#tabs button.on{color:#04223d;background:linear-gradient(135deg,#8defff,var(--glow));box-shadow:0 0 18px rgba(62,224,255,.55)}
.tools{display:flex;gap:8px;width:290px;justify-content:flex-end}
.ic{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(4,14,32,.7);color:var(--paper);font-size:18px;cursor:pointer}
.ic:hover{background:rgba(62,224,255,.18)}
main{position:absolute;left:22px;right:22px;top:68px;bottom:18px}
.panel{position:absolute;inset:0;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.03) inset;overflow:hidden}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{font:600 14px var(--fb);color:#04223d;background:linear-gradient(135deg,#8defff,var(--glow));border:0;padding:9px 16px;border-radius:12px;cursor:pointer;box-shadow:0 6px 18px rgba(62,224,255,.22);transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--paper);border:1px solid var(--line);box-shadow:none}
.btn.amber{background:linear-gradient(135deg,#ffe08a,var(--amber));color:#3a2600;box-shadow:0 6px 18px rgba(255,196,61,.22)}
.btn.bad{background:rgba(255,95,122,.16);color:#ffc3cc;border:1px solid rgba(255,95,122,.5);box-shadow:none}

/* ---------- split layout with topic nav ---------- */
.split{display:grid;grid-template-columns:206px 1fr;gap:16px;height:100%}
.tnav{display:flex;flex-direction:column;gap:7px}
.tn{display:flex;align-items:center;gap:10px;text-align:left;font:500 13.5px var(--fb);color:var(--paper);background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:13px;padding:0 10px;height:63px;cursor:pointer;transition:.15s;line-height:1.25}
.tn em{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--fh);font-style:normal;background:rgba(62,224,255,.15);color:var(--glow)}
.tn:hover{background:rgba(62,224,255,.1)}
.tn.on{background:linear-gradient(135deg,rgba(62,224,255,.28),rgba(123,140,255,.22));border-color:var(--glow);box-shadow:0 0 18px rgba(62,224,255,.25)}
.tn.on em{background:var(--glow);color:#04223d}

/* ---------- Teori ---------- */
.teori{display:grid;grid-template-columns:1fr 410px;gap:18px;height:100%}
.teori h2,.proc h2{margin:0 0 4px;font:700 27px var(--fh);letter-spacing:-.2px}
.tpline{color:var(--mute);font-size:13.5px;margin:0 0 12px}
.teori ul{margin:0 0 12px;padding-left:20px}
.teori li{margin:4px 0;font-size:15px}
.fbox{padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(62,224,255,.18),rgba(123,140,255,.14));border:1px solid var(--glow);box-shadow:0 0 22px rgba(62,224,255,.15);font:600 17px/1.55 var(--fh);margin-bottom:12px}
.fbox small{display:block;font:500 12.5px var(--fb);color:var(--mute);margin-bottom:2px}
.ex{padding:11px 16px;border-radius:14px;background:rgba(255,196,61,.1);border-left:4px solid var(--amber);font-size:14.5px;margin-bottom:12px}
.ex b{color:var(--amber)}
.tfig{border-radius:16px;border:1px solid var(--line);background:rgba(3,12,28,.6);padding:10px;display:flex;flex-direction:column;justify-content:center}
.tfig svg{width:100%;height:auto}
.tfig p{margin:6px 4px 0;font-size:13px;color:var(--mute);text-align:center}
.trow{display:flex;gap:10px;margin-top:auto}
.tcol{display:flex;flex-direction:column;height:100%;min-width:0}

/* svg classes */
svg .A{fill:rgba(62,224,255,.16);stroke:#3ee0ff;stroke-width:3;stroke-linejoin:round}
svg .B{fill:rgba(255,196,61,.16);stroke:#ffc43d;stroke-width:3;stroke-linejoin:round}
svg .G{fill:rgba(47,230,160,.2);stroke:#2fe6a0;stroke-width:3;stroke-linejoin:round}
svg .ln{stroke:#9fb6d4;stroke-width:2;fill:none}
svg .dash{stroke-dasharray:7 5}
svg .ra{fill:none;stroke:#eaf6ff;stroke-width:1.6}
svg .lbl{fill:#eaf6ff;font:600 15px 'Lexend',sans-serif}
svg .lbl.s{font-size:13px;fill:#b9cde6;font-weight:500}
svg .lbl.c{fill:#3ee0ff}
svg .lbl.y{fill:#ffc43d}
svg .lbl.b{font-size:17px;font-family:'Sora',sans-serif}

/* ---------- Prosedur ---------- */
.proc{display:grid;grid-template-columns:1fr 330px;gap:18px;height:100%}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid transparent;cursor:pointer;transition:.15s;font-size:15px}
.steps li:hover{border-color:var(--line)}
.steps li .nb{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--fh);border:2px solid var(--glow);color:var(--glow)}
.steps li.done{background:rgba(47,230,160,.12);border-color:rgba(47,230,160,.45)}
.steps li.done .nb{background:var(--ok);border-color:var(--ok);color:#04223d}
.steps li.done span.tx{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35);color:#b9d9cf}
.pside{display:flex;flex-direction:column;gap:12px}
.card{border-radius:16px;background:rgba(3,12,28,.6);border:1px solid var(--line);padding:14px 16px}
.card h4{margin:0 0 6px;font:700 15px var(--fh)}
.card p{margin:0;font-size:14px;color:#cfe0f5}
.pbar{height:10px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--glow));transition:width .3s}

/* ---------- Simulasi ---------- */
.simwrap{display:grid;grid-template-columns:1fr 306px;gap:14px;height:100%;min-width:0}
.sim-view{position:relative;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:
  linear-gradient(rgba(62,224,255,.06) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(62,224,255,.06) 1px,transparent 1px) 0 0/28px 28px,rgba(3,12,28,.72)}
.sim-view svg{position:absolute;inset:0;width:100%;height:100%}
.verdict{position:absolute;left:14px;top:12px;max-width:calc(100% - 28px);padding:8px 14px;border-radius:12px;font:600 14.5px var(--fb);border:1px solid;backdrop-filter:blur(6px)}
.verdict.ok{background:rgba(47,230,160,.2);border-color:var(--ok);color:#baffe3}
.verdict.bad{background:rgba(255,95,122,.18);border-color:var(--bad);color:#ffd0d7}
.verdict.info{background:rgba(62,224,255,.16);border-color:var(--glow);color:#c9f6ff}
.sim-ctrl{display:flex;flex-direction:column;gap:9px;min-width:0}
.sc-h h3{margin:0;font:700 17px var(--fh)}
.sc-h p{margin:3px 0 0;font-size:13px;color:var(--mute);line-height:1.4}
.ctrls{display:flex;flex-direction:column;gap:8px}
.ctl label{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:2px}
.ctl label b{color:var(--amber);font-family:var(--fh);font-weight:600}
.ctl input[type=range]{width:100%;accent-color:#3ee0ff;height:22px;cursor:pointer}
.ctl input[type=number]{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(3,12,28,.8);color:var(--paper);font:600 15px var(--fb)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:8px 4px;font:600 13px var(--fb);border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--paper);cursor:pointer}
.seg button.on{background:var(--glow);color:#04223d;border-color:var(--glow)}
.tog{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:#3ee0ff}
.read{padding:10px 12px;border-radius:12px;background:rgba(3,12,28,.7);border:1px solid var(--line);font-size:13px;line-height:1.55;flex:1;min-height:0;overflow:hidden}
.read div{margin:1px 0}
.read .hl{color:var(--amber);font-weight:600}
.read .ck{color:var(--ok)}.read .xx{color:var(--bad)}
.read table{width:100%;border-collapse:collapse;font-size:12.5px}
.read td,.read th{padding:2px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.read th{color:var(--mute);font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:7px}
.btns .btn{padding:8px 12px;font-size:13px}

/* ---------- LKPD ---------- */
.lk{display:grid;grid-template-columns:258px 1fr;gap:16px;height:100%}
.lkn{display:flex;flex-direction:column;gap:8px}
.lkn .row{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.lkn .rl{font-size:12px;color:var(--mute);margin:2px 0 -2px;font-weight:500}
.qb{height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--paper);font:600 13px var(--fh);cursor:pointer;transition:.12s}
.qb:hover{background:rgba(62,224,255,.15)}
.qb.cur{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,196,61,.4)}
.qb.ok{background:rgba(47,230,160,.28);border-color:var(--ok)}
.qb.no{background:rgba(255,95,122,.26);border-color:var(--bad)}
.lktop{display:flex;align-items:center;gap:10px;margin-top:auto}
.lktop input{flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:rgba(3,12,28,.8);color:var(--paper);font:500 14px var(--fb)}
.score{padding:6px 12px;border-radius:12px;background:rgba(255,196,61,.14);border:1px solid var(--amber);font:700 15px var(--fh);color:var(--amber);cursor:pointer;white-space:nowrap}
.qcard{display:flex;flex-direction:column;height:100%;min-width:0}
.qhead{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.qno{font:700 19px var(--fh)}
.pill{padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(123,140,255,.22);border:1px solid var(--glow2);color:#d3d9ff}
.pill.t{background:rgba(62,224,255,.14);border-color:var(--glow);color:#c9f6ff}
.qtext{font-size:17px;line-height:1.5;margin-bottom:12px;font-weight:500}
.qbody{flex:1;min-height:0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--paper);font:500 15.5px var(--fb);cursor:pointer;transition:.12s}
.opt:hover{background:rgba(62,224,255,.12)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--fh);background:rgba(62,224,255,.16);color:var(--glow)}
.opt.sel{border-color:var(--glow);background:rgba(62,224,255,.2)}
.opt.sel .k{background:var(--glow);color:#04223d}
.opt.ok{border-color:var(--ok);background:rgba(47,230,160,.2)}
.opt.ok .k{background:var(--ok);color:#04223d}
.opt.no{border-color:var(--bad);background:rgba(255,95,122,.18)}
.opt.no .k{background:var(--bad);color:#2a0008}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.bsrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.bsrow .opt{justify-content:center;font:700 21px var(--fh);padding:22px 10px}
.dd-line{font-size:17px;margin:11px 0;line-height:2.1}
.slot{display:inline-block;min-width:96px;min-height:36px;padding:2px 10px;margin:0 4px;border-radius:10px;border:2px dashed var(--glow);vertical-align:middle;text-align:center;line-height:30px;background:rgba(62,224,255,.06);font-weight:600;color:var(--amber);cursor:pointer}
.slot.over{background:rgba(62,224,255,.3)}
.slot.filled{border-style:solid;background:rgba(255,196,61,.12)}
.slot.ok{border-color:var(--ok);background:rgba(47,230,160,.2);color:#baffe3}
.slot.no{border-color:var(--bad);background:rgba(255,95,122,.2);color:#ffd0d7}
.dd-pool{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;padding:12px;min-height:58px;border-radius:14px;border:1px dashed var(--line);background:rgba(3,12,28,.5)}
.chip{padding:7px 15px;border-radius:99px;background:linear-gradient(135deg,#ffe08a,var(--amber));color:#3a2600;font:600 15px var(--fb);cursor:grab;user-select:none;box-shadow:0 4px 12px rgba(255,196,61,.25)}
.chip.sel{outline:3px solid var(--glow);outline-offset:2px}
.mj{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:2px}
.mj .col{display:flex;flex-direction:column;gap:9px}
.mji{position:relative;display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.05);font-size:14.5px;line-height:1.35;cursor:pointer;color:var(--paper);text-align:left;font-family:var(--fb);min-height:49px}
.mji:hover{background:rgba(62,224,255,.12)}
.mji.sel{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,196,61,.35)}
.mji .bd{flex:none;min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--fh);background:rgba(255,255,255,.14)}
.mji.ok{border-color:var(--ok)}.mji.no{border-color:var(--bad)}
.qfb{margin-top:8px;padding:10px 14px;border-radius:13px;font-size:14px;min-height:0}
.qfb.ok{background:rgba(47,230,160,.15);border:1px solid var(--ok)}
.qfb.no{background:rgba(255,95,122,.14);border:1px solid var(--bad)}
.qfoot{display:flex;gap:10px;margin-top:10px;align-items:center}
.qfoot .sp{flex:1}
.ovl{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(3,10,24,.78);backdrop-filter:blur(6px);border-radius:20px}
.ovl .box{width:470px;text-align:center;padding:28px 30px;border-radius:22px;background:linear-gradient(160deg,#0e2a55,#08183a);border:1px solid var(--glow);box-shadow:0 0 50px rgba(62,224,255,.4)}
.ovl h3{margin:0 0 4px;font:800 26px var(--fh)}
.ovl .big{font:800 62px var(--fh);color:var(--amber);line-height:1.1;margin:8px 0}
.ovl p{margin:6px 0 16px;color:#cfe0f5}

/* ---------- Pengembang ---------- */
.dev{display:grid;grid-template-columns:690px 1fr;gap:26px;height:100%;align-items:center}
.devimg{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--glow);box-shadow:0 0 0 6px rgba(62,224,255,.1),0 0 50px rgba(62,224,255,.3)}
.devimg img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.devimg .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 22px 16px;background:linear-gradient(to top,rgba(3,10,24,.95),rgba(3,10,24,0))}
.devimg .cap b{display:block;font:800 29px var(--fh);letter-spacing:-.3px}
.devimg .cap span{color:#bfeaff;font-size:15.5px}
.devinfo h2{margin:0;font:800 34px var(--fh);letter-spacing:-.5px}
.devinfo .sub{color:var(--glow);font:600 16px var(--fh);margin:2px 0 14px}
.dl{display:grid;grid-template-columns:128px 1fr;gap:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:rgba(3,12,28,.55)}

let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',vol=.12,delay=0,slide=0){
  if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+delay;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);
}

  drop:()=>tone(420,.07,'sine',.11),
  start:()=>[392,523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.12,i*.09)),

};

  el.innerHTML=TOPICS.map((t,i)=>`<button class="tn" data-i="${i}"><em>${i+1}</em><span>${t.short}</span></button>`).join('');
  el.onclick=e=>{const b=e.target.closest('.tn');if(b)onSel(+b.dataset.i)};

    const tog=li=>{const k=+li.dataset.k,a=procDone[i],ix=a.indexOf(k);if(ix>=0)a.splice(ix,1);else{a.push(k);sfx.ok&&tone(660+k*90,.12,'triangle',.1)}paint();if(a.length===t.steps.length)sfx.ok()};
    $$('.steps li').forEach(li=>{li.onclick=()=>tog(li);li.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tog(li)}}});

/* ===================== SIMULASI: kerangka ===================== */
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const P=a=>a.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
const T=(x,y,t,cls='lbl',anc='middle')=>`<text class="${cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anc}">${t}</text>`;
const centroid=v=>({x:v.reduce((a,p)=>a+p.x,0)/v.length,y:v.reduce((a,p)=>a+p.y,0)/v.length});
function outward(p,c,d){const dx=p.x-c.x,dy=p.y-c.y,l=Math.hypot(dx,dy)||1;return{x:p.x+dx/l*d,y:p.y+dy/l*d}}
/* label sudut/titik/sisi untuk poligon */
function drawPoly(v,cls,names,sideTxt,ncls){
  const c=centroid(v);let s=`<polygon class="${cls}" points="${P(v)}"/>`;
  v.forEach((p,i)=>{const q=outward(p,c,17);s+=T(q.x,q.y+5,names[i],'lbl b '+(ncls||''))});
  if(sideTxt)v.forEach((p,i)=>{const n=v[(i+1)%v.length];const m={x:(p.x+n.x)/2,y:(p.y+n.y)/2};const q=outward(m,c,17);if(sideTxt[i]!=null)s+=T(q.x,q.y+4,sideTxt[i],'lbl s')});
  return s;
}
function raMark(p,u1,u2,s=13){const a={x:p.x+u1.x*s,y:p.y+u1.y*s},b={x:a.x+u2.x*s,y:a.y+u2.y*s},c={x:p.x+u2.x*s,y:p.y+u2.y*s};return`<path class="ra" d="M${a.x.toFixed(1)} ${a.y.toFixed(1)}L${b.x.toFixed(1)} ${b.y.toFixed(1)}L${c.x.toFixed(1)} ${c.y.toFixed(1)}"/>`}
function unit(a,b){const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l}}
/* jajargenjang/persegi panjang: w sisi alas, h sisi miring, th sudut kiri bawah */
function quad(w,h,th,s,ox,oy){const c=Math.cos(rad(th)),sn=Math.sin(rad(th));
  return[{x:ox,y:oy},{x:ox+w*s,y:oy},{x:ox+(w+h*c)*s,y:oy-h*sn*s},{x:ox+h*c*s,y:oy-h*sn*s}]}
function xform(v,rot,flip){if(!rot&&!flip)return v;const c=centroid(v),r=rad(rot);
  return v.map(p=>{let x=p.x-c.x,y=p.y-c.y;if(flip)x=-x;return{x:c.x+x*Math.cos(r)-y*Math.sin(r),y:c.y+x*Math.sin(r)+y*Math.cos(r)}})}
/* segitiga dari sisi a,b,c (A di kiri bawah) */
function triSides(a,b,c,s,ox,oy){const cosA=(b*b+c*c-a*a)/(2*b*c);if(Math.abs(cosA)>=1)return null;const sinA=Math.sqrt(1-cosA*cosA);
  return[{x:ox,y:oy},{x:ox+c*s,y:oy},{x:ox+b*cosA*s,y:oy-b*sinA*s}]}
const sinRule=(R,Adeg)=>2*R*Math.sin(rad(Adeg));

function buildSim(host,cfg){
  const st=JSON.parse(JSON.stringify(cfg.init));let ready=false,lastK=null;
  host.innerHTML=`<div class="sim-view"><svg viewBox="0 0 700 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${cfg.title}"></svg><div class="verdict" hidden></div></div>
  <div class="sim-ctrl"><div class="sc-h"><h3>${cfg.title}</h3><p>${cfg.task}</p></div><div class="ctrls"></div><div class="read"></div><div class="btns"></div></div>`;
  const svg=$('svg',host),read=$('.read',host),vd=$('.verdict',host);
  function ctrls(){
    const box=$('.ctrls',host);box.innerHTML='';
    cfg.controls(st).forEach(c=>{
      const d=document.createElement('div');d.className='ctl';
      if(c.type==='range'){
        d.innerHTML=`<label><span>${c.label}</span><b></b></label><input type="range" min="${c.min}" max="${c.max}" step="${c.step}" aria-label="${c.label}">`;
        const inp=$('input',d),b=$('b',d);inp.value=st[c.key];
        const setv=()=>b.textContent=fmt(st[c.key],c.d??1)+(c.unit||'');setv();
        inp.oninput=()=>{st[c.key]=+inp.value;setv();slideSnd(inp);cfg.onChange&&cfg.onChange(st,c.key);render()};
      }else if(c.type==='seg'){
        d.innerHTML=`<label><span>${c.label}</span></label><div class="seg">${c.options.map(o=>`<button data-v="${o[0]}" class="${st[c.key]===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`;
        $$('button',d).forEach(b=>b.onclick=()=>{st[c.key]=b.dataset.v;cfg.onChange&&cfg.onChange(st,c.key);ctrls();render()});
      }else if(c.type==='toggle'){
        d.innerHTML=`<label class="tog"><input type="checkbox" ${st[c.key]?'checked':''}><span>${c.label}</span></label>`;
        $('input',d).onchange=e=>{st[c.key]=e.target.checked;cfg.onChange&&cfg.onChange(st,c.key);render()};
      }else if(c.type==='num'){
        d.innerHTML=`<label><span>${c.label}</span></label><div style="display:flex;gap:7px"><input type="number" step="0.1" min="0" placeholder="mis. 7,5" value="${st[c.key]??''}" aria-label="${c.label}"><button class="btn amber" style="padding:8px 12px">Periksa</button></div>`;
        const go=()=>{const v=parseFloat(String($('input',d).value).replace(',','.'));if(isNaN(v)){toast('Isi jawaban dulu');return}st[c.key]=v;st.checked=true;render()};
        $('button',d).onclick=go;$('input',d).onkeydown=e=>{if(e.key==='Enter')go()};
      }
      box.appendChild(d);
    });
  }
  function btns(){
    const b=$('.btns',host);b.innerHTML='';
    (cfg.buttons?cfg.buttons(st):[]).forEach(x=>{const e=document.createElement('button');e.className='btn '+(x.cls||'ghost');e.textContent=x.t;e.onclick=()=>{x.fn(st);ctrls();render()};b.appendChild(e)});
    const r=document.createElement('button');r.className='btn bad';r.textContent='Reset';r.onclick=()=>{Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,JSON.parse(JSON.stringify(cfg.init)));lastK=null;ctrls();render();sfx.reset();toast('Simulasi dikembalikan ke awal')};b.appendChild(r);
  }
  function render(){
    const o=cfg.draw(st);svg.innerHTML=o.svg;read.innerHTML=o.read;
    if(o.verdict){vd.hidden=false;vd.className='verdict '+o.verdict.k;vd.textContent=o.verdict.t;if(ready&&o.verdict.k==='ok'&&lastK!=='ok')sfx.ok();lastK=o.verdict.k}else{vd.hidden=true;lastK=null}
  }
  ctrls();btns();render();ready=true;
  return{render};
}

  <div>Sisi sebanding? <span class="${sr?'ck':'xx'}">${sr?'Ya ✓':'Belum ✗'}</span></div><div>∠P = ${s.ba}°, ∠A = 90°: <span class="${sa?'ck':'xx'}">${sa?'sama ✓':'beda ✗'}</span></div>

/* 2. Segitiga sebangun */
SIMS[1]={title:'Segitiga sebangun',task:'Ubah ∠P dan ∠Q agar sama dengan △ABC (50°, 60°, 70°), lalu geser skala k.',
init:{k:1.4,P:40,Q:75},
controls:()=>[{type:'range',key:'k',label:'Skala k',min:.6,max:2,step:.05,d:2},{type:'range',key:'P',label:'Sudut P',min:30,max:110,step:1,unit:'°',d:0},{type:'range',key:'Q',label:'Sudut Q',min:30,max:110,step:1,unit:'°',d:0}],
buttons:()=>[{t:'Beri petunjuk',cls:'amber',fn:s=>{s.P=50;s.Q=60}}],
draw:s=>{
  const RA=3.5,sc=22,a=sinRule(RA,50),b=sinRule(RA,60),c=sinRule(RA,70);
  const A=triSides(a,b,c,sc,50,400);let svg=drawPoly(A,'A',['A','B','C'],[fmt(c,1),fmt(a,1),fmt(b,1)],'c');
  svg+=T(A[0].x+10,A[0].y-12,'50°','lbl s','start')+T(A[1].x-10,A[1].y-12,'60°','lbl s','end')+T(A[2].x,A[2].y+26,'70°','lbl s');
  const R=180-s.P-s.Q;
  if(R<10)return{svg,read:`<div class="xx">Jumlah sudut segitiga harus 180°. Kurangi ∠P atau ∠Q.</div>`,verdict:{k:'bad',t:'Segitiga PQR tidak dapat dibentuk'}};
  const RB=RA*s.k,p=sinRule(RB,s.P),q=sinRule(RB,s.Q),r=sinRule(RB,R);
  const B=triSides(p,q,r,sc,310,400);
  svg+=drawPoly(B,'B',['P','Q','R'],[fmt(r,1),fmt(p,1),fmt(q,1)],'y')+T(B[0].x+10,B[0].y-12,s.P+'°','lbl s','start')+T(B[1].x-10,B[1].y-12,s.Q+'°','lbl s','end')+T(B[2].x,B[2].y+26,R+'°','lbl s');
  const ok=Math.abs(s.P-50)<.6&&Math.abs(s.Q-60)<.6;
  const read=`<div>∠P = ${s.P}° (∠A = 50°) <span class="${s.P===50?'ck':'xx'}">${s.P===50?'✓':'✗'}</span></div><div>∠Q = ${s.Q}° (∠B = 60°) <span class="${s.Q===60?'ck':'xx'}">${s.Q===60?'✓':'✗'}</span></div><div>∠R = ${R}° (∠C = 70°) <span class="${R===70?'ck':'xx'}">${R===70?'✓':'✗'}</span></div>
  <div style="margin-top:4px">p/a = ${fmt(p,1)}/${fmt(a,1)} = <span class="hl">${fmt(p/a,2)}</span></div><div>q/b = ${fmt(q,1)}/${fmt(b,1)} = <span class="hl">${fmt(q/b,2)}</span></div><div>r/c = ${fmt(r,1)}/${fmt(c,1)} = <span class="hl">${fmt(r/c,2)}</span></div>
  ${ok?`<div class="ck">Sudut sama, maka ketiga perbandingan sisi sama dengan k = ${fmt(s.k,2)}.</div>`:`<div class="xx">Sudut berbeda, perbandingan sisi tidak sama.</div>`}`;
  return{svg,read,verdict:ok?{k:'ok',t:'△ABC ∼ △PQR ✓ (sd-sd-sd dan s-s-s)'}:{k:'bad',t:'Belum sebangun: sudut bersesuaian belum sama'}};
}};

SIMS[2]={title:'Garis sejajar alas',task:'DE ∥ BC dan AB = 12 cm. Geser AD dan ubah BC, lalu hitung DE.',

/* 6. Segitiga kongruen (△ABC: a=8, b=10, c=6; ∠A≈53,13°, ∠B=90°, ∠C≈36,87°) */
const TA={a:8,b:10,c:6,A:Math.acos((100+36-64)/(2*10*6))*180/Math.PI,B:90,C:0};TA.C=180-TA.A-TA.B;
const CRIT={sss:{n:'s-s-s',f:['a','b','c']},sas:{n:'s-sd-s',f:['b','c','A']},asa:{n:'sd-s-sd',f:['B','C','a']},aas:{n:'sd-sd-s',f:['A','B','a']}};
const LBL={a:'sisi a (BC)',b:'sisi b (CA)',c:'sisi c (AB)',A:'sudut A',B:'sudut B',C:'sudut C'};
function solveTri(m,v){let a,b,c;
  if(m==='sss'){a=v.a;b=v.b;c=v.c}
  else if(m==='sas'){b=v.b;c=v.c;a=Math.sqrt(b*b+c*c-2*b*c*Math.cos(rad(v.A)))}
  else if(m==='asa'){const A=180-v.B-v.C;if(A<=3)return null;a=v.a;b=a*Math.sin(rad(v.B))/Math.sin(rad(A));c=a*Math.sin(rad(v.C))/Math.sin(rad(A))}
  else{const C=180-v.A-v.B;if(C<=3)return null;a=v.a;b=a*Math.sin(rad(v.B))/Math.sin(rad(v.A));c=a*Math.sin(rad(C))/Math.sin(rad(v.A))}
  const cosA=(b*b+c*c-a*a)/(2*b*c);if(!(Math.abs(cosA)<1)||a<=0||b<=0||c<=0)return null;
  const A=deg(Math.acos(cosA)),cosB=(a*a+c*c-b*b)/(2*a*c),B=deg(Math.acos(cosB));return{a,b,c,A,B,C:180-A-B}}
SIMS[5]={title:'Segitiga kongruen',task:'Pilih kriteria, lalu atur tiga unsur △PQR sampai sama dengan △ABC.',
init:{m:'sss',a:5,b:7,c:9,A:40,B:70,C:50,ib:0},
controls:s=>{const f=CRIT[s.m].f;return[{type:'seg',key:'m',label:'Kriteria kekongruenan',options:[['sss','s-s-s'],['sas','s-sd-s'],['asa','sd-s-sd'],['aas','sd-sd-s']]}].concat(f.map(k=>/[abc]/.test(k)?{type:'range',key:k,label:LBL[k].replace('sisi','Sisi'),min:2,max:12,step:.5,unit:' cm'}:{type:'range',key:k,label:LBL[k].replace('sudut','Sudut'),min:20,max:120,step:1,unit:'°',d:0}))},
buttons:s=>[{t:'Beri petunjuk',cls:'amber',fn:s=>{CRIT[s.m].f.forEach(k=>s[k]=/[abc]/.test(k)?TA[k]:Math.round(TA[k]))}}],
draw:s=>{
  const f=CRIT[s.m].f,A=triSides(TA.a,TA.b,TA.c,22,40,400);let svg=drawPoly(A,'A',['A','B','C'],[TA.c,TA.a,TA.b],'c');
  const sol=solveTri(s.m,s),pr=['P','Q','R'];
  if(!sol)return{svg,read:'<div class="xx">Ketiga unsur belum membentuk segitiga. Ubah nilainya.</div>',verdict:{k:'bad',t:'Segitiga PQR belum dapat dibentuk'}};
  const B=triSides(sol.a,sol.b,sol.c,22,390,400);svg+=drawPoly(B,'B',pr,[fmt(sol.c,1),fmt(sol.a,1),fmt(sol.b,1)],'y');
  const tol=k=>/[abc]/.test(k)?.06:.7;
  const ok=f.every(k=>Math.abs(s[k]-TA[k])<=tol(k));
  const row=(k)=>{const sd=/[abc]/.test(k),ta=sd?fmt(TA[k],1):fmt(TA[k],1)+'°',tb=sd?fmt(sol[k],1):fmt(sol[k],1)+'°',m=Math.abs(sol[k]-TA[k])<(sd?.1:1);return`<tr><td>${k}</td><td>${ta}</td><td>${tb}</td><td class="${m?'ck':'xx'}">${m?'✓':'✗'}</td></tr>`};
  const read=`<div>Diketahui (${CRIT[s.m].n}): <span class="hl">${f.join(', ')}</span></div><table><tr><th>Unsur</th><th>△ABC</th><th>△PQR</th><th></th></tr>${['a','b','c','A','B','C'].map(row).join('')}</table>`+(ok?'<div class="ck" style="margin-top:3px">Semua unsur sama, maka △ABC ≅ △PQR.</div>':'');
  return{svg,read,verdict:ok?{k:'ok',t:`△ABC ≅ △PQR ✓ berdasarkan ${CRIT[s.m].n}`}:{k:'bad',t:'Belum kongruen: ada unsur yang berbeda'}};
}};

/* 7. Garis potong trapesium */
SIMS[6]={title:'Garis potong trapesium',task:'AB ∥ DC dan EF ∥ AB. Geser m untuk mengubah perbandingan DE : EA.',
init:{ab:12,dc:6,m:3,aux:false},
controls:()=>[{type:'range',key:'ab',label:'Panjang AB',min:8,max:16,step:.5,unit:' cm'},{type:'range',key:'dc',label:'Panjang DC',min:3,max:12,step:.5,unit:' cm'},{type:'range',key:'m',label:'m (DE : EA = m : 10 − m)',min:1,max:9,step:1,d:0},{type:'toggle',key:'aux',label:'Garis bantu (bukti)'}],
buttons:()=>[{t:'E titik tengah',cls:'amber',fn:s=>{s.m=5}}],
draw:s=>{
  const ab=s.ab,dc=Math.min(s.dc,ab-1),m=s.m,n=10-m,u=m/10,ef=(m*ab+n*dc)/10,sc=30,x0=(700-sc*ab)/2,yb=400,yt=150,off=(ab-dc)/2;
  const A={x:x0,y:yb},B={x:x0+sc*ab,y:yb},D={x:x0+sc*off,y:yt},C={x:D.x+sc*dc,y:yt};
  const E={x:D.x+u*(A.x-D.x),y:D.y+u*(A.y-D.y)},F={x:C.x+u*(B.x-C.x),y:C.y+u*(B.y-C.y)};
  let svg=`<polygon class="A" points="${P([A,B,C,D])}"/>`;
  if(s.aux){const Q={x:A.x+sc*(ab-dc),y:yb},Pp={x:D.x+u*(Q.x-D.x),y:D.y+u*(Q.y-D.y)};
    svg+=`<polygon class="B" points="${P([D,A,Q])}"/><line x1="${D.x}" y1="${D.y}" x2="${Q.x}" y2="${Q.y}" stroke="#2fe6a0" stroke-width="3" class="dash"/>`+T(Q.x+4,Q.y+22,'Q','lbl b y')+T(Pp.x+10,Pp.y-8,'P','lbl y')}
  svg+=`<line x1="${E.x}" y1="${E.y}" x2="${F.x}" y2="${F.y}" stroke="#ffc43d" stroke-width="4" stroke-dasharray="9 5"/>`;
  svg+=T(A.x-14,A.y+6,'A','lbl b')+T(B.x+14,B.y+6,'B','lbl b')+T(C.x+14,C.y-4,'C','lbl b')+T(D.x-14,D.y-4,'D','lbl b')+T(E.x-16,E.y+5,'E','lbl b y')+T(F.x+16,F.y+5,'F','lbl b y');
  svg+=T((A.x+B.x)/2,A.y+26,'AB = '+fmt(ab)+' cm','lbl s')+T((D.x+C.x)/2,D.y-10,'DC = '+fmt(dc)+' cm','lbl s')+T((E.x+F.x)/2,E.y-10,'EF = '+fmt(ef,2)+' cm','lbl y');
  const read=`<div>DE : EA = <span class="hl">${m} : ${n}</span></div><div>EF = (m × AB + n × DC)/(m + n)</div><div>EF = (${m} × ${fmt(ab)} + ${n} × ${fmt(dc)})/10 = <span class="hl">${fmt(ef,2)} cm</span></div>
  ${s.aux?`<div style="margin-top:4px">△DEP ∼ △DAQ, AQ = AB − DC = ${fmt(ab-dc)}</div><div>EP = ${m}/10 × ${fmt(ab-dc)} = ${fmt(u*(ab-dc),2)}</div><div>EF = EP + PF = ${fmt(u*(ab-dc),2)} + ${fmt(dc)} = ${fmt(ef,2)}</div>`:''}
  ${m===5?`<div class="ck">E titik tengah: EF = ½ (AB + DC) = ${fmt((ab+dc)/2,2)}</div>`:''}`;
  return{svg,read,verdict:{k:'info',t:'EF ∥ AB ∥ DC, panjang EF bergantung pada m : n'}};
}};

/* 8. Tinggi pohon dari bayangan */
SIMS[7]={title:'Tinggi pohon dan bayangan',task:'Pada waktu yang sama, hitung tinggi pohon dari tinggi dan bayangan pengamat.',

controls:()=>[{type:'range',key:'sun',label:'Sudut matahari',min:30,max:65,step:1,unit:'°',d:0},{type:'range',key:'hp',label:'Tinggi pengamat',min:1.2,max:1.9,step:.1,unit:' m'},{type:'num',key:'guess',label:'Jawabanmu: tinggi pohon (m)'},{type:'toggle',key:'steps',label:'Tampilkan langkah'}],

  svg+=`<line x1="${px}" y1="${gy-ph}" x2="${px+sp*sc}" y2="${gy}" stroke="#ffc43d" stroke-width="2" class="dash"/><line x1="${tx}" y1="${gy-th}" x2="${tx+stt*sc}" y2="${gy}" stroke="#ffc43d" stroke-width="2" class="dash"/>`;
  svg+=`<circle cx="${px}" cy="${gy-ph+ph*.1}" r="${Math.max(5,ph*.1)}" fill="#eaf6ff"/><rect x="${px-5}" y="${gy-ph+ph*.22}" width="10" height="${ph*.45}" rx="4" fill="#3ee0ff"/><line x1="${px}" y1="${gy-ph*.34}" x2="${px}" y2="${gy}" stroke="#3ee0ff" stroke-width="5"/>`;

  let v;if(!s.checked)v={k:'info',t:'Berapa tinggi pohon? Tulis jawabanmu lalu tekan Periksa.'};else if(ok)v={k:'ok',t:'Benar ✓ tinggi pohon ≈ '+fmt(exp,1)+' m'};else v={k:'bad',t:'Belum tepat. Periksa perbandingan tinggi : bayangan.'};

{t:'mj',tp:1,q:'Jodohkan istilah dengan artinya. Klik istilah di kiri, lalu klik pasangannya di kanan.',p:[['Sebangun','Bentuk sama, ukuran boleh berbeda'],['Kongruen','Bentuk dan ukuran sama persis'],['Skala (k)','Perbandingan sisi-sisi bersesuaian'],['Sudut bersesuaian','Sudut yang letaknya sama pada dua bangun']],e:'Sebangun: bentuk sama. Kongruen: bentuk dan ukuran sama. Skala adalah perbandingan sisi bersesuaian.'},
{t:'mj',tp:6,q:'Jodohkan kriteria kekongruenan dengan unsur yang diketahui.',p:[['s-s-s','Tiga sisi sama panjang'],['s-sd-s','Dua sisi dan sudut apitnya'],['sd-s-sd','Dua sudut dan sisi di antaranya'],['sd-sd-s','Dua sudut dan sisi di depan salah satunya']],e:'Singkatan menunjukkan urutan unsur: s = sisi, sd = sudut.'},
{t:'mj',tp:4,q:'Jodohkan rumus air mancur dengan hasilnya.',p:[['CD²','AD × DB'],['AC²','AD × AB'],['BC²','DB × AB'],['AB','AD + DB']],e:'CD² = AD·DB, AC² = AD·AB, BC² = DB·AB, dan AB = AD + DB.'},
{t:'mj',tp:3,q:'Jodohkan soal dengan jawabannya.',p:[['Persegi panjang 6 × 4 diperbesar skala 3: lebarnya …','12 cm'],['DE ∥ BC, AD = 3, AB = 9, BC = 15: DE = …','5 cm'],['Siku-siku di C, AD = 1, DB = 9: CD = …','3 cm'],['△ABC ≅ △PQR, AC = 7 cm: PR = …','7 cm']],e:'4 × 3 = 12. DE = 3/9 × 15 = 5. CD = √(1 × 9) = 3. Pada bangun kongruen, sisi bersesuaian sama panjang.'},
{t:'mj',tp:8,q:'Jodohkan data bayangan dengan tinggi pohon atau tiang.',p:[['Orang 1,5 m, bayangan 3 m; pohon bayangan 20 m','10 m'],['Orang 1,6 m, bayangan 2 m; tiang bayangan 5 m','4 m'],['Tongkat 1 m, bayangan 1,5 m; gedung bayangan 30 m','20 m'],['Anak 1,2 m, bayangan 1,6 m; tiang bayangan 8 m','6 m']],e:'1,5/3 × 20 = 10. 1,6/2 × 5 = 4. 1/1,5 × 30 = 20. 1,2/1,6 × 8 = 6.'},
{t:'mj',tp:7,q:'Trapesium AB ∥ DC dengan E dan F titik tengah kaki. Jodohkan data dengan panjang EF.',p:[['AB = 10 cm, DC = 6 cm','8 cm'],['AB = 14 cm, DC = 8 cm','11 cm'],['AB = 20 cm, DC = 12 cm','16 cm'],['AB = 9 cm, DC = 5 cm','7 cm']],e:'EF = ½ (AB + DC): 8, 11, 16, dan 7.'}
];
const QS=Q.map(()=>({done:false,ok:false,r:null}));
let qi=0,lkReported=false;
const rowLbl=['Pilihan ganda (1–6)','Pilihan ganda kompleks (7–12)','Benar / Salah (13–18)','Seret dan lepas (19–24)','Menjodohkan (25–30)'];

INIT.lkpd=()=>{
  const p=$('#p-lkpd');
  p.innerHTML=`<div class="lk"><div class="lkn"><div id="lknav"></div><div class="lktop" style="flex-direction:column;align-items:stretch;gap:8px">
    <input id="lkName" placeholder="Nama siswa" aria-label="Nama siswa"><div style="display:flex;gap:8px"><div class="score" id="lkScore" title="Lihat hasil" role="button" tabindex="0">Skor 0/30</div><button class="btn bad" id="lkReset" style="flex:1">Reset LKPD</button></div></div></div>
    <div class="qcard" id="qcard"></div></div>`;
  $('#lknav').innerHTML=rowLbl.map((l,r)=>`<div class="rl">${l}</div><div class="row">${[0,1,2,3,4,5].map(c=>`<button class="qb" data-i="${r*6+c}" aria-label="Soal ${r*6+c+1}">${r*6+c+1}</button>`).join('')}</div>`).join('');
  $('#lknav').onclick=e=>{const b=e.target.closest('.qb');if(b){qi=+b.dataset.i;showQ()}};
  $('#lkReset').onclick=()=>{Q.forEach((q,i)=>QS[i]={done:false,ok:false,r:null});qi=0;lkReported=false;showQ();sfx.reset();toast('LKPD dikembalikan ke awal')};
  $('#lkScore').onclick=()=>result(true);
  showQ();
};
function updNav(){
  $$('.qb').forEach(b=>{const i=+b.dataset.i,s=QS[i];b.className='qb'+(i===qi?' cur':'')+(s.done?(s.ok?' ok':' no'):'')});
  const sc=QS.filter(s=>s.ok).length;$('#lkScore').textContent=`Skor ${sc}/30`;
}
function showQ(){
  const q=Q[qi],s=QS[qi],card=$('#qcard');
  card.innerHTML=`<div class="qhead"><span class="qno">Soal ${qi+1} dari 30</span><span class="pill">${TYPES[q.t]}</span><span class="pill t">TP ${q.tp}: ${TOPICS[q.tp-1].short}</span></div>
  <div class="qtext">${q.q}</div><div class="qbody" id="qbody"></div><div class="qfb" id="qfb" hidden></div>
  <div class="qfoot"><button class="btn ghost" id="qPrev">Sebelumnya</button><button class="btn ghost" id="qAgain" hidden>Ulangi soal</button><span class="sp"></span><button class="btn amber" id="qCheck">Periksa jawaban</button><button class="btn" id="qNext">Berikutnya</button></div>`;
  $('#qPrev').onclick=()=>{qi=(qi+29)%30;showQ()};
  $('#qNext').onclick=()=>{qi=(qi+1)%30;showQ()};
  $('#qAgain').onclick=()=>{QS[qi]={done:false,ok:false,r:null};showQ()};
  $('#qCheck').onclick=checkQ;
  RENDER[q.t](q,s,$('#qbody'));
  if(s.done)feedback(true);
  updNav();syncCheck();
}
function syncCheck(){const q=Q[qi],s=QS[qi];let has=false;
  if(q.t==='pg')has=s.r!=null;else if(q.t==='pk')has=(s.r||[]).length>0;else if(q.t==='bs')has=s.r!=null;
  else if(q.t==='dd')has=s.slots&&s.slots.every(x=>x!=null);else if(q.t==='mj')has=s.map&&s.map.every(x=>x!=null);
  $('#qCheck').disabled=s.done||!has;$('#qCheck').hidden=s.done;$('#qAgain').hidden=!s.done}
function checkQ(){
  const q=Q[qi],s=QS[qi];let ok=false;
  if(q.t==='pg')ok=s.r===q.a;
  else if(q.t==='pk')ok=[...s.r].sort().join()===q.a.join();
  else if(q.t==='bs')ok=s.r===q.a;
  else if(q.t==='dd')ok=q.a.every((a,i)=>q.c[s.slots[i]]===a);
  else ok=s.map.every((r,i)=>r===i);
  s.done=true;s.ok=ok;ok?sfx.ok():sfx.bad();
  showQ();
  if(QS.every(x=>x.done)&&!lkReported){lkReported=true;setTimeout(()=>result(false),700)}
}
function feedback(){
  const q=Q[qi],s=QS[qi],fb=$('#qfb');fb.hidden=false;fb.className='qfb '+(s.ok?'ok':'no');
  fb.innerHTML=`<b>${s.ok?'Benar! ':'Belum tepat. '}</b>${q.e}`;
}
const L='ABCDE';
const RENDER={
 pg(q,s,b){
  b.innerHTML=q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${L[i]}</span><span>${o}</span></button>`).join('');
  const paint=()=>$$('.opt',b).forEach((e,i)=>{let c='opt';if(s.done){if(i===q.a)c+=' ok';else if(i===s.r)c+=' no'}else if(i===s.r)c+=' sel';e.className=c});
  $$('.opt',b).forEach((e,i)=>e.onclick=()=>{if(s.done)return;s.r=i;paint();syncCheck()});paint();
 },
 pk(q,s,b){
  s.r=s.r||[];
  b.innerHTML=`<div class="tpline" style="margin:-4px 0 8px">Pilih semua jawaban yang benar (lebih dari satu).</div>`+q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${L[i]}</span><span>${o}</span></button>`).join('');
  const paint=()=>$$('.opt',b).forEach((e,i)=>{const on=s.r.includes(i),cor=q.a.includes(i);let c='opt';if(s.done){if(cor&&on)c+=' ok';else if(cor)c+=' miss';else if(on)c+=' no'}else if(on)c+=' sel';e.className=c});
  $$('.opt',b).forEach((e,i)=>e.onclick=()=>{if(s.done)return;const k=s.r.indexOf(i);k>=0?s.r.splice(k,1):s.r.push(i);paint();syncCheck()});paint();
 },
 bs(q,s,b){
  b.innerHTML=`<div class="bsrow"><button class="opt" data-v="1">Benar</button><button class="opt" data-v="0">Salah</button></div>`;
  const paint=()=>$$('.opt',b).forEach(e=>{const v=e.dataset.v==='1';let c='opt';if(s.done){if(v===q.a)c+=' ok';else if(v===s.r)c+=' no'}else if(v===s.r)c+=' sel';e.className=c});
  $$('.opt',b).forEach(e=>e.onclick=()=>{if(s.done)return;s.r=e.dataset.v==='1';paint();syncCheck()});paint();
 },
 dd(q,s,b){
  if(!s.order){s.order=shuffle(q.c.map((_,i)=>i));s.slots=q.a.map(()=>null)}
  let sel=null;
  b.innerHTML=`<div>${q.l.map(l=>`<div class="dd-line">${l.replace(/\[\[(\d+)\]\]/g,(m,i)=>`<span class="slot" data-s="${i}" style="${q.wide?'display:inline-block;min-width:470px;text-align:left':''}"></span>`)}</div>`).join('')}</div>
   <div class="tpline" style="margin:12px 0 4px">Seret pilihan ke kotak, atau klik pilihan lalu klik kotaknya.</div><div class="dd-pool"></div>`;
  const pool=$('.dd-pool',b);
  function paint(){
    $$('.slot',b).forEach(e=>{const i=+e.dataset.s,v=s.slots[i];e.textContent=v!=null?q.c[v]:'';let c='slot'+(v!=null?' filled':'');if(s.done)c+=q.c[v]===q.a[i]?' ok':' no';e.className=c;e.draggable=!s.done&&v!=null});
    pool.innerHTML=s.order.filter(ci=>!s.slots.includes(ci)).map(ci=>`<span class="chip${sel===ci?' sel':''}" data-c="${ci}" draggable="${!s.done}">${q.c[ci]}</span>`).join('');
    $$('.chip',pool).forEach(ch=>{const ci=+ch.dataset.c;
      ch.onclick=()=>{if(s.done)return;sel=sel===ci?null:ci;sfx.drop();paint()};
      ch.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(ci));e.dataTransfer.effectAllowed='move'}});
    syncCheck();
  }
  function place(si,ci){const old=s.slots[si];const from=s.slots.indexOf(ci);if(from>=0)s.slots[from]=null;s.slots[si]=ci;if(old!=null&&from>=0&&old!==ci)s.slots[from]=old;sel=null;sfx.drop();paint()}
  $$('.slot',b).forEach(e=>{const si=+e.dataset.s;
    e.onclick=()=>{if(s.done)return;if(sel!=null)place(si,sel);else if(s.slots[si]!=null){s.slots[si]=null;sfx.drop();paint()}};
    e.ondragover=ev=>{ev.preventDefault();e.classList.add('over')};e.ondragleave=()=>e.classList.remove('over');
    e.ondrop=ev=>{ev.preventDefault();e.classList.remove('over');if(s.done)return;const ci=+ev.dataTransfer.getData('text/plain');if(!isNaN(ci))place(si,ci)};
    e.ondragstart=ev=>{ev.dataTransfer.setData('text/plain',String(s.slots[si]))}});
  pool.ondragover=ev=>ev.preventDefault();
  pool.ondrop=ev=>{ev.preventDefault();if(s.done)return;const ci=+ev.dataTransfer.getData('text/plain'),f=s.slots.indexOf(ci);if(f>=0){s.slots[f]=null;sfx.drop();paint()}};
  paint();
 },
 mj(q,s,b){
  if(!s.order){s.order=shuffle(q.p.map((_,i)=>i));s.map=q.p.map(()=>null)}
  let sel=null;const col=['#3ee0ff','#ffc43d','#ff8fd0','#9bff8a'];
  b.innerHTML=`<div class="mj"><div class="col" id="mjl"></div><div class="col" id="mjr"></div></div><div class="tpline" style="margin-top:10px">Klik istilah di kiri, lalu klik pasangannya di kanan. Klik lagi untuk melepas pasangan.</div>`;
  function paint(){
    $('#mjl',b).innerHTML=q.p.map((x,i)=>{const m=s.map[i];let c='mji';if(sel===i)c+=' sel';if(s.done)c+=m===i?' ok':' no';
      return`<button class="${c}" data-i="${i}" style="${m!=null?'border-left:8px solid '+col[i]:''}"><span class="bd" style="background:${col[i]};color:#04223d">${i+1}</span>${x[0]}</button>`}).join('');
    $('#mjr',b).innerHTML=s.order.map((pi,k)=>{const li=s.map.indexOf(pi);let c='mji';if(s.done&&li>=0)c+=li===pi?' ok':' no';
      return`<button class="${c}" data-r="${pi}" style="${li>=0?'border-right:8px solid '+col[li]:''}"><span class="bd" style="background:rgba(255,255,255,.14)">${'ABCD'[k]}</span>${q.p[pi][1]}${li>=0?`<span class="bd" style="margin-left:auto;background:${col[li]};color:#04223d">${li+1}</span>`:''}</button>`}).join('');
    $$('#mjl .mji',b).forEach(e=>e.onclick=()=>{if(s.done)return;const i=+e.dataset.i;if(s.map[i]!=null&&sel!==i){s.map[i]=null;sel=i}else sel=sel===i?null:i;sfx.drop();paint()});
    $$('#mjr .mji',b).forEach(e=>e.onclick=()=>{if(s.done)return;const r=+e.dataset.r,ex=s.map.indexOf(r);
      if(sel!=null){if(ex>=0)s.map[ex]=null;s.map[sel]=r;sel=null;sfx.drop()}else if(ex>=0){s.map[ex]=null;sfx.drop()}paint()});
    syncCheck();
  }
  paint();
 }
};
function result(manual){
  const sc=QS.filter(s=>s.ok).length,done=QS.filter(s=>s.done).length,pct=Math.round(sc/30*100);
  const msg=pct>=85?'Luar biasa! Pemahamanmu sangat baik.':pct>=70?'Bagus! Tinggal sedikit lagi.':pct>=50?'Cukup. Ulangi Teori dan Simulasi pada bagian yang masih salah.':'Ayo belajar lagi. Buka Teori dan coba Simulasi, lalu kerjakan ulang.';
  const nm=($('#lkName').value||'').trim();
  const o=document.createElement('div');o.className='ovl';
  o.innerHTML=`<div class="box"><h3>${nm?'Hasil '+nm:'Hasil LKPD'}</h3><div class="big">${sc}<span style="font-size:30px;color:var(--mute)">/30</span></div><p>${manual&&done<30?`Baru ${done} soal dikerjakan. `:''}Nilai ${pct}. ${msg}</p><div class="btns" style="justify-content:center"><button class="btn" id="oClose">Tutup</button><button class="btn amber" id="oAgain">Ulangi LKPD</button></div></div>`;
  $('#p-lkpd').appendChild(o);if(pct>=70)sfx.win();
  $('#oClose').onclick=()=>o.remove();$('#oAgain').onclick=()=>{o.remove();$('#lkReset').click()};
}

INIT.dev=()=>{
  $('#p-dev').innerHTML=`<div class="dev"><div class="devimg"><img alt="Foto pengembang: Yus Yenimar, Guru SMPN 42 Pekanbaru" src="${IMG}"><div class="cap"><b>Yus Yenimar</b><span>Guru SMPN 42 Pekanbaru</span></div></div>
  <div class="devinfo"><h2>Yus Yenimar</h2><div class="sub">Guru SMPN 42 Pekanbaru</div>
  <dl class="dl"><dt>Mata pelajaran</dt><dd>Matematika</dd><dt>Sasaran</dt><dd>Peserta didik SMP, Fase D</dd><dt>Unit</dt><dd>Kesebangunan dan Kekongruenan</dd><dt>Sub unit</dt><dd>Segitiga dan segiempat</dd><dt>Isi lab maya</dt><dd>8 simulasi interaktif dan 30 soal LKPD</dd><dt>Capaian</dt><dd>Menjelaskan sifat kesebangunan dan kekongruenan, lalu memakainya untuk masalah kontekstual dan geometri terstruktur.</dd></dl>
  <div class="badges"><button class="btn" id="dSim">Mulai bereksperimen</button><button class="btn ghost" id="dLk">Kerjakan LKPD</button></div></div></div>`;
  $('#dSim').onclick=()=>showTab('simulasi');$('#dLk').onclick=()=>showTab('lkpd');
};
